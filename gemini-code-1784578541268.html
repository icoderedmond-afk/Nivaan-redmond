<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Ping Pong Game</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    canvas {
      background-color: #000;
      border: 4px solid #fff;
      display: block;
      margin: 20px auto;
    }
    p {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>Ping Pong Game</h1>
  <p>Use the <strong>W</strong> and <strong>S</strong> keys to move the left paddle.</p>
  
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game objects
    const paddleWidth = 10;
    const paddleHeight = 80;

    // Player Paddle (Left)
    const player = {
      x: 10,
      y: canvas.height / 2 - paddleHeight / 2,
      score: 0
    };

    // Computer Paddle (Right)
    const computer = {
      x: canvas.width - 20,
      y: canvas.height / 2 - paddleHeight / 2,
      score: 0
    };

    // Ball
    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 8,
      speedX: 5,
      speedY: 5
    };

    // Key input tracking
    let wPressed = false;
    let sPressed = false;

    document.addEventListener("keydown", (e) => {
      if (e.key === "w" || e.key === "W") wPressed = true;
      if (e.key === "s" || e.key === "S") sPressed = true;
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "w" || e.key === "W") wPressed = false;
      if (e.key === "s" || e.key === "S") sPressed = false;
    });

    // Reset ball to center
    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speedX = -ball.speedX; // Send ball to the winner
      ball.speedY = 5 * (Math.random() > 0.5 ? 1 : -1);
    }

    // Update game logic
    function update() {
      // Move Player
      if (wPressed && player.y > 0) {
        player.y -= 7;
      }
      if (sPressed && player.y < canvas.height - paddleHeight) {
        player.y += 7;
      }

      // Move Computer (Simple AI tracking ball)
      const computerCenter = computer.y + paddleHeight / 2;
      if (computerCenter < ball.y - 15) {
        computer.y += 4;
      } else if (computerCenter > ball.y + 15) {
        computer.y -= 4;
      }

      // Move Ball
      ball.x += ball.speedX;
      ball.y += ball.speedY;

      // Ball collision with top and bottom walls
      if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.speedY = -ball.speedY;
      }

      // Ball collision with Player paddle
      if (
        ball.x - ball.radius < player.x + paddleWidth &&
        ball.y > player.y &&
        ball.y < player.y + paddleHeight
      ) {
        ball.speedX = -ball.speedX;
      }

      // Ball collision with Computer paddle
      if (
        ball.x + ball.radius > computer.x &&
        ball.y > computer.y &&
        ball.y < computer.y + paddleHeight
      ) {
        ball.speedX = -ball.speedX;
      }

      // Scoring
      if (ball.x < 0) {
        computer.score++;
        resetBall();
      } else if (ball.x > canvas.width) {
        player.score++;
        resetBall();
      }
    }

    // Render elements to canvas
    function draw() {
      // Clear screen
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw center net line
      ctx.strokeStyle = "#fff";
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]); // Reset dash

      // Draw Player Paddle
      ctx.fillStyle = "#fff";
      ctx.fillRect(player.x, player.y, paddleWidth, paddleHeight);

      // Draw Computer Paddle
      ctx.fillRect(computer.x, computer.y, paddleWidth, paddleHeight);

      // Draw Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      // Draw Scores
      ctx.font = "32px sans-serif";
      ctx.fillText(player.score, canvas.width / 4, 50);
      ctx.fillText(computer.score, (3 * canvas.width) / 4, 50);
    }

    // Main game loop
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Start game
    gameLoop();
  </script>

</body>
</html>
